name: CardioFocus signed upload and Apple review
on:
  push:
    branches: ['cardiofocus/apple-upload', 'cardiofocus/apple-upload/**', 'cardiofocus/apple-submit-review', 'cardiofocus/apple-submit-review/**']
  workflow_dispatch:
    inputs:
      action:
        description: 'Upload signed build or submit a processed build for review'
        type: choice
        options: [upload, submit_review]
        default: upload
      build_number:
        description: 'Unique CFBundleVersion; for review, an already processed build'
        type: string
        required: true
permissions:
  contents: read
jobs:
  apple:
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ios/CardioFocus
    env:
      ASC_KEY_ID: ${{ secrets.CARDIOFOCUS_ASC_KEY_ID || secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.CARDIOFOCUS_ASC_ISSUER_ID || secrets.ASC_ISSUER_ID }}
      APP_BUILD_NUMBER: ${{ inputs.build_number || (startsWith(github.ref_name, 'cardiofocus/apple-upload') && github.run_number) || vars.CARDIOFOCUS_REVIEW_BUILD_NUMBER }}
      CARDIOFOCUS_SUBMISSION_CONFIG_JSON: ${{ secrets.CARDIOFOCUS_SUBMISSION_CONFIG_JSON }}
      APPLE_TEAM_ID: ${{ secrets.CARDIOFOCUS_APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve immutable build number from release branch or explicit input
        run: |
          python3 - <<'PYTHON'
          import os,re,sys
          parts=os.environ.get('GITHUB_REF_NAME','').split('/')
          number=parts[2] if len(parts)>=4 and parts[1] in ['apple-upload','apple-submit-review'] else os.environ.get('APP_BUILD_NUMBER','')
          if not re.fullmatch(r'[0-9]+(?:\.[0-9]+){0,2}',number):sys.exit('An actual numeric build number is required.')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('APP_BUILD_NUMBER='+number+'\n')
          PYTHON
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API cryptography support
        run: python3 -m pip install 'cryptography>=43,<47'
      - name: Select supported Xcode
        run: python3 scripts/select_xcode.py
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios/CardioFocus
      - name: Prepare ephemeral App Store Connect key
        env:
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.CARDIOFOCUS_ASC_PRIVATE_KEY_P8 }}
        run: |
          python3 - <<'PY'
          import os,base64,pathlib,sys
          pem=os.environ.get('ASC_PRIVATE_KEY_P8','').encode()
          if not pem and os.environ.get('ASC_PRIVATE_KEY_BASE64'):pem=base64.b64decode(os.environ['ASC_PRIVATE_KEY_BASE64'],validate=True)
          if not pem:sys.exit('Configure App Store Connect secrets in this repository; never put private keys in source or chat.')
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'AuthKey.p8'
          from cryptography.hazmat.primitives import serialization
          serialization.load_pem_private_key(pem,password=None)
          p.write_bytes(pem);p.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('ASC_KEY_FILE='+str(p)+'\n')
          PY
      - name: Mask private review-contact fields in public CI logs
        run: |
          python3 - <<'PYTHON'
          import json,os
          config=json.loads(os.environ.get('CARDIOFOCUS_SUBMISSION_CONFIG_JSON') or '{}')
          for key in ['reviewContactFirstName','reviewContactLastName','reviewContactEmail','reviewContactPhone']:
              value=config.get(key)
              if isinstance(value,str) and value:print('::add-mask::'+value.replace('\n',''))
          PYTHON
      - name: Validate source and build configuration
        run: python3 scripts/preflight.py
      - name: Verify Apple API access and exact app record
        run: python3 scripts/asc_preflight.py
      - name: Generate project
        if: inputs.action == 'upload' || startsWith(github.ref_name, 'cardiofocus/apple-upload')
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
      - name: Archive and sign
        if: inputs.action == 'upload' || startsWith(github.ref_name, 'cardiofocus/apple-upload')
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CARDIOFOCUS_CERTIFICATE_P12_BASE64 || secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CARDIOFOCUS_CERTIFICATE_PASSWORD || secrets.CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.CARDIOFOCUS_PROVISIONING_PROFILE_BASE64 || secrets.PROVISIONING_PROFILE_BASE64 }}
        run: scripts/sign_archive.sh
      - name: Upload signed build to App Store Connect
        if: inputs.action == 'upload' || startsWith(github.ref_name, 'cardiofocus/apple-upload')
        env:
          IPA_PATH: build/export/CardioFocus.ipa
        run: bundle exec fastlane ios upload
      - name: Apply factual age-rating answers through Apple API
        if: inputs.action == 'submit_review' || startsWith(github.ref_name, 'cardiofocus/apple-submit-review')
        run: python3 scripts/asc_metadata.py
      - name: Submit processed build and metadata for review
        if: inputs.action == 'submit_review' || startsWith(github.ref_name, 'cardiofocus/apple-submit-review')
        run: bundle exec fastlane ios submit_review
      - name: Verify Apple's actual review state for this exact build
        if: inputs.action == 'submit_review' || startsWith(github.ref_name, 'cardiofocus/apple-submit-review')
        run: python3 scripts/asc_review_receipt.py
      - uses: actions/upload-artifact@v4
        if: inputs.action == 'submit_review' || startsWith(github.ref_name, 'cardiofocus/apple-submit-review')
        with:
          name: CardioFocus-Apple-review-receipt
          path: ios/CardioFocus/build/apple-review-receipt.json
          retention-days: 30
      - name: Remove ephemeral API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@v4
        if: (inputs.action == 'upload' || startsWith(github.ref_name, 'cardiofocus/apple-upload')) && success()
        with:
          name: CardioFocus-signed-build
          path: ios/CardioFocus/build/export/*.ipa
          retention-days: 7
