name: Strainwave iOS

on:
  push:
    branches: ["**"]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: strainwave-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The simulation rules are pure Swift, so they can be verified in seconds
  # without a simulator. This job is the fast signal on every push.
  engine:
    name: Engine rules
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Run engine tests
        run: swift test --package-path ios/OutbreakEngine

  localisation:
    name: Localisation parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare every strings table
        run: python3 ios/tools/check_strings.py

  # Builds the app and runs its tests on both extremes of the size range
  # (section 8.7).
  app:
    name: App on ${{ matrix.device }}
    runs-on: macos-15
    needs: [engine]
    strategy:
      fail-fast: false
      matrix:
        device:
          - "iPhone SE (3rd generation)"
          - "iPhone 16 Pro Max"
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install xcodegen xcbeautify

      - name: Generate the Xcode project
        working-directory: ios/Strainwave
        run: xcodegen generate

      - name: Resolve a simulator
        id: destination
        run: |
          set -euo pipefail
          wanted="${{ matrix.device }}"
          if xcrun simctl list devices available | grep -qF "$wanted"; then
            echo "name=$wanted" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::'$wanted' is not installed on this runner; falling back."
            fallback=$(xcrun simctl list devices available \
              | grep -oE 'iPhone [^(]+' | head -1 | sed 's/[[:space:]]*$//')
            echo "name=$fallback" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test
        working-directory: ios/Strainwave
        run: |
          set -euo pipefail
          bundle="TestResults-$(echo '${{ matrix.device }}' | tr ' ()' '___').xcresult"
          xcodebuild test \
            -project Strainwave.xcodeproj \
            -scheme Strainwave \
            -destination "platform=iOS Simulator,name=${{ steps.destination.outputs.name }},OS=latest" \
            -resultBundlePath "$bundle" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | xcbeautify

      # Surfaced rather than enforced: the log is long, and a warning summary is
      # the only way to notice one before it becomes a habit.
      - name: Warning summary
        if: always()
        working-directory: ios/Strainwave
        run: |
          if [ ! -f build.log ]; then echo "No build log."; exit 0; fi
          echo "--- compiler warnings ---"
          grep -E "warning: " build.log \
            | sed -E 's#^.*/([^/]+\.swift)#\1#' \
            | sort -u \
            | head -60 || echo "none"
          echo "--- accessibility audit ---"
          grep -E "Accessibility audit|  • |Longest unassisted run" build.log | head -60 || echo "none"

      # Only on failure: with UI tests running, a green result bundle is
      # hundreds of megabytes of screenshots nobody reads.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ strategy.job-index }}
          path: ios/Strainwave/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  # Manual only. Signs, archives, and uploads a build to TestFlight.
  # Every secret this needs is listed in docs/RELEASE.md.
  testflight:
    name: Upload to TestFlight
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    needs: [engine, app, localisation]
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios/Strainwave
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: xcodegen generate

      - name: Import the signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.IOS_DISTRIBUTION_CERT_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          certificate="$RUNNER_TEMP/certificate.p12"

          echo -n "$CERTIFICATE_P12" | base64 --decode -o "$certificate"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$certificate"

      - name: Install the provisioning profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$PROVISIONING_PROFILE" | base64 --decode \
            -o ~/Library/MobileDevice/Provisioning\ Profiles/strainwave.mobileprovision

      - name: Archive
        working-directory: ios/Strainwave
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Strainwave.xcodeproj \
            -scheme Strainwave \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Strainwave.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}"

      - name: Export the IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.strainwave.app</key>
              <string>${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Strainwave.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to App Store Connect
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          echo -n "$PRIVATE_KEY" | base64 --decode -o ~/private_keys/AuthKey_${KEY_ID}.p8

          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/Strainwave.ipa" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Clean up secrets from the runner
        if: always()
        run: |
          rm -rf ~/private_keys
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/strainwave.mobileprovision
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
