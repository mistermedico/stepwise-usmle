name: Pathogen Protocol iOS

on:
  push:
    branches: [main]
    paths:
      - "PathogenProtocol/**"
      - ".github/workflows/pathogen-protocol-ios.yml"
  pull_request:
    paths:
      - "PathogenProtocol/**"
      - ".github/workflows/pathogen-protocol-ios.yml"
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Archive, sign, and upload a build to TestFlight"
        type: boolean
        default: false

defaults:
  run:
    working-directory: PathogenProtocol

jobs:
  build-and-test:
    name: Build & Unit Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # A hardcoded Xcode path has already broken CI once here (Xcode_16.app has no iOS
      # Simulator runtime installed), and it turns out *no* Xcode on this runner image
      # ships one preinstalled. Select the newest Xcode, then explicitly download an
      # iOS simulator runtime if none is already present.
      - name: Select Xcode and ensure an iOS Simulator runtime is installed
        run: |
          set -euo pipefail
          echo "Installed Xcode apps:"
          ls -d /Applications/Xcode*.app
          APP=$(ls -d /Applications/Xcode*.app | sort -rV | head -1)
          echo "Selecting $APP"
          sudo xcode-select -s "$APP/Contents/Developer"
          xcodebuild -version

          echo "Simulator runtimes before:"
          xcrun simctl list runtimes

          if ! xcrun simctl list runtimes | grep -qi "^iOS "; then
            echo "No ready iOS runtime found — downloading one (can take several minutes)..."
            sudo xcodebuild -downloadPlatform iOS
          fi

          echo "Simulator runtimes after:"
          xcrun simctl list runtimes
          xcrun simctl list runtimes | grep -qi "^iOS " || {
            echo "::error::Still no ready iOS Simulator runtime after downloadPlatform."
            exit 1
          }

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project PathogenProtocol.xcodeproj \
            -scheme PathogenProtocol

      - name: Pick an available iPhone simulator
        id: simulator
        run: |
          set -euo pipefail
          echo "Available simulators:"
          xcrun simctl list devices available
          LINE=$(xcrun simctl list devices available | grep -E "iPhone" | grep -v "unavailable" | head -1)
          if [ -z "$LINE" ]; then
            echo "::error::No available iPhone simulator found on this runner."
            exit 1
          fi
          UDID=$(echo "$LINE" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          echo "Selected: $LINE"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project PathogenProtocol.xcodeproj \
            -scheme PathogenProtocol \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: |
          xcodebuild test-without-building \
            -project PathogenProtocol.xcodeproj \
            -scheme PathogenProtocol \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: PathogenProtocol/TestResults.xcresult

  # Stand-in for a manual Simulator + VoiceOver pass, since nobody on this project has
  # a Mac: launches the real app on real simulated hardware at both screen-size
  # extremes from the design spec, captures screenshots of the Home/Game/Evolution
  # screens, and runs XCTest's automated accessibility audit. Screenshots + the full
  # .xcresult are uploaded as artifacts so they can be pulled down and inspected.
  device-screenshots:
    name: Screenshots & Accessibility Audit (${{ matrix.device_label }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - device_label: iPhone-SE
            device_pattern: "iPhone SE"
          - device_label: iPhone-Pro-Max
            device_pattern: "Pro Max"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode and ensure an iOS Simulator runtime is installed
        run: |
          set -euo pipefail
          APP=$(ls -d /Applications/Xcode*.app | sort -rV | head -1)
          sudo xcode-select -s "$APP/Contents/Developer"
          xcodebuild -version
          if ! xcrun simctl list runtimes | grep -qi "^iOS "; then
            echo "No ready iOS runtime found — downloading one (can take several minutes)..."
            sudo xcodebuild -downloadPlatform iOS
          fi
          xcrun simctl list runtimes
          xcrun simctl list runtimes | grep -qi "^iOS " || {
            echo "::error::Still no ready iOS Simulator runtime after downloadPlatform."
            exit 1
          }

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick simulator matching "${{ matrix.device_pattern }}"
        id: simulator
        run: |
          set -euo pipefail
          echo "Available simulators:"
          xcrun simctl list devices available
          LINE=$(xcrun simctl list devices available | grep -i "${{ matrix.device_pattern }}" | grep -v "unavailable" | head -1)
          if [ -z "$LINE" ]; then
            echo "::warning::No simulator matching '${{ matrix.device_pattern }}' found; falling back to any iPhone."
            LINE=$(xcrun simctl list devices available | grep -E "iPhone" | grep -v "unavailable" | head -1)
          fi
          if [ -z "$LINE" ]; then
            echo "::error::No available iPhone simulator found on this runner at all."
            exit 1
          fi
          UDID=$(echo "$LINE" | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          echo "Selected: $LINE"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Run UI tests (screenshots + accessibility audit)
        run: |
          xcodebuild test \
            -project PathogenProtocol.xcodeproj \
            -scheme PathogenProtocolUITests \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath UITestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Export screenshot attachments from the test result bundle
        if: always()
        continue-on-error: true
        run: |
          set -x
          mkdir -p Screenshots
          xcrun xcresulttool export attachments \
            --path UITestResults.xcresult \
            --output-path Screenshots
          echo "Exported files:"
          find Screenshots -type f

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.device_label }}
          path: PathogenProtocol/Screenshots
          if-no-files-found: warn

      - name: Upload UI test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results-${{ matrix.device_label }}
          path: PathogenProtocol/UITestResults.xcresult
          if-no-files-found: warn

  release:
    name: Archive & Upload to TestFlight
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight
    runs-on: macos-15
    env:
      DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode and ensure an iOS Simulator runtime is installed
        run: |
          set -euo pipefail
          APP=$(ls -d /Applications/Xcode*.app | sort -rV | head -1)
          sudo xcode-select -s "$APP/Contents/Developer"
          xcodebuild -version
          if ! xcrun simctl list runtimes | grep -qi "^iOS "; then
            echo "No ready iOS runtime found — downloading one (can take several minutes)..."
            sudo xcodebuild -downloadPlatform iOS
          fi
          xcrun simctl list runtimes
          xcrun simctl list runtimes | grep -qi "^iOS " || {
            echo "::error::Still no ready iOS Simulator runtime after downloadPlatform."
            exit 1
          }

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Imports the distribution certificate + provisioning profile into a throwaway
      # keychain that only exists for this job run, per Apple's documented CI pattern.
      - name: Install signing certificate and provisioning profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH=$RUNNER_TEMP/dist_certificate.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/ci-signing.keychain-db

          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive
        run: |
          xcodebuild archive \
            -project PathogenProtocol.xcodeproj \
            -scheme PathogenProtocol \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/PathogenProtocol.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM"

      - name: Export IPA
        run: |
          cat <<'EOF' > "$RUNNER_TEMP/ExportOptions.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_DEVELOPMENT_TEAM_ID }}</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PathogenProtocol.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/private_keys
          echo -n "$API_KEY_BASE64" | base64 --decode -o ~/private_keys/AuthKey_"$API_KEY_ID".p8
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/export/PathogenProtocol.ipa" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"
