name: PathogenProtocol
options:
  bundleIdPrefix: com.pathogenprotocol
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    ENABLE_PREVIEWS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  PathogenProtocol:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/App
      - path: Sources/Engine
      - path: Sources/ViewModels
      - path: Sources/Views
      - path: Sources/Services
      - path: Sources/Persistence
      - path: Sources/Design
      - path: Resources
        buildPhase: resources
    resources:
      - path: Resources/Localizations
      - path: Resources/Assets.xcassets
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Pathogen Protocol
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSUserTrackingUsageDescription: "This identifier is used to show you relevant ads that support free play."
        GADApplicationIdentifier: "$(ADMOB_APP_ID)"
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations:
          - en
          - he
        CFBundleDevelopmentRegion: en
    entitlements:
      path: Sources/App/PathogenProtocol.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pathogenprotocol.app
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform

  PathogenProtocolTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests/PathogenProtocolTests
    dependencies:
      - target: PathogenProtocol
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pathogenprotocol.app.tests

schemes:
  PathogenProtocol:
    build:
      targets:
        PathogenProtocol: all
        PathogenProtocolTests: [test]
    test:
      targets:
        - PathogenProtocolTests
      commandLineArguments:
        "-AppleLanguages (en)": false
    run:
      config: Debug
    archive:
      config: Release

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 11.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 2.3.0
