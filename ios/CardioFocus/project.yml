name: CardioFocus
options:
  bundleIdPrefix: com.mistermedico
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  CardioFocus:
    type: application
    platform: iOS
    sources:
      - path: CardioFocus
        excludes:
          - PrivacyInfo.xcprivacy
      - path: CardioFocus/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mistermedico.cardiofocus
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: CardioFocus
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en
        INFOPLIST_KEY_CardioFocusSupportURL: 'https://mistermedico.github.io/cardiofocus-support/'
        SUPPORTS_MACCATALYST: NO
  CardioFocusTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CardioFocusTests]
    dependencies:
      - target: CardioFocus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mistermedico.cardiofocus.tests
  CardioFocusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [CardioFocusUITests]
    dependencies:
      - target: CardioFocus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mistermedico.cardiofocus.uitests
schemes:
  CardioFocus:
    build:
      targets:
        CardioFocus: all
        CardioFocusTests: [test]
        CardioFocusUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - CardioFocusTests
        - CardioFocusUITests
    archive:
      config: Release
