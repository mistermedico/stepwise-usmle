name: Nonogram

options:
  bundleIdPrefix: com.nonogramstudio
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only
    SUPPORTS_MACCATALYST: false
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  Nonogram:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Nonogram
        excludes:
          # Everything under Resources, and the entitlements file, is listed explicitly below
          # (resources: / entitlements:) instead — excluded here so xcodegen doesn't add each
          # of them to the project twice.
          - "Resources/**"
          - "*.entitlements"
    resources:
      - path: Nonogram/Resources/Levels
        buildPhase: resources
        type: folder # folder reference (blue folder), so Bundle.url(subdirectory:) works
      - path: Nonogram/Resources/Assets.xcassets
      - path: Nonogram/Resources/en.lproj
      - path: Nonogram/Resources/he.lproj
    info:
      path: Nonogram/Info.plist
      properties:
        CFBundleDisplayName: "Picture Cross"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        # Default (English) ATT prompt copy. Per-language overrides live in
        # Resources/<lang>.lproj/InfoPlist.strings (Apple resolves usage-description
        # keys like this one through InfoPlist.strings automatically per locale).
        NSUserTrackingUsageDescription: "We use your data to show ads that are more relevant to you. Your gameplay progress always stays on this device either way."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIRequiresFullScreen: true
        CFBundleLocalizations:
          - en
          - he
        CFBundleDevelopmentRegion: en
        # Intentionally no UIUserInterfaceStyle key: the app must follow the system
        # light/dark appearance rather than being locked to one.
    settings:
      base:
        # NOTE: this bundle id is a placeholder. Whoever ships this app must own
        # "com.nonogramstudio.picturecross" in their own Apple Developer account
        # (or replace it here with an id they do own) before archiving for App Store submission.
        PRODUCT_BUNDLE_IDENTIFIER: com.nonogramstudio.picturecross
        PRODUCT_NAME: Nonogram
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # NOTE: Info.plist is generated on disk by the `info:` block below (an explicit
        # INFOPLIST_FILE), not by Xcode's own GENERATE_INFOPLIST_FILE mechanism — using both
        # at once is a common source of "Multiple commands produce Info.plist" build errors.
        SUPPORTS_MAC_CATALYST: false
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      # Pointed at the checked-in file (see Nonogram/Nonogram.entitlements) rather than
      # generated from `properties:` here, so its explanatory comment survives `xcodegen generate`.
      path: Nonogram/Nonogram.entitlements

  NonogramTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: NonogramTests
    dependencies:
      - target: Nonogram
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.9"

schemes:
  Nonogram:
    build:
      targets:
        Nonogram: all
        NonogramTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NonogramTests
      gatherCoverageData: true
    archive:
      config: Release
